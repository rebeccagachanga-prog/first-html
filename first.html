<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My website</title>
    <!-- Link the CSS reference file -->
     <link rel="stylesheet" href="cssref.css">
</head>

<body>
    <h1>First</h1>
    <h1>First</h1>
    <section id="text">
        <u>Underlined text</u>
        <mark>Highlighted text</mark>
        <em>Italic text using em</em>
        <br>Line break<br>
        <hr>hoorizontal line
    </section>
    <!-- links -->
    <section>
        <h2>links</h2>
        <!-- External Links -->
        <a href="https://www.google.com/" target="_blank">
            Visit Google
        </a>
        <!-- Internal links -->
        <a href="recipe.html">opens recipe html</a>
    </section>
      <!-- ===== DIV & SPAN ===== -->
        <section>
            <h2>Div & Span</h2>

            <div class="box">
                <!-- div is a block-level container -->
                This is a div
            </div>

            <p>
                This is <span style="color:red;">span text</span> inside a paragraph.
                <!-- span is inline -->
            </p>
        </section>
    <!-- Forms -->
    <section id="Forms">
        <h2>Forms</h2>

        <forms>
            <!-- Label + Input -->
            <label>Name:</label>
            <input type="text" placeholder="Enter your name"><br><br>

            <!-- Email -->
            <label>Email:</label>
            <input type="email"><br><br>

            <!-- Radio Buttons -->
            <label> Gender:</label>
            <input type="radio" name="gender"> Male
            <input type="radio" name="gender"> Female
            <br><br>

            <!-- Checkbox -->
            <input type="checkbox"> I agree to terms
            <br><br>
            <!-- Dropdown -->
            <select>
                <option>HTML</option>
                <option>CSS</option>
                <option>JavaScript</option>
            </select>
            <br><br>
            <!-- Button -->
            <button type="submit">Submit</button>
        </forms>
    </section> 
    <!-- FOOter -->
    <footer>
        <p> HTML Learning Reference</p>
    </footer>
</body>
</html>
